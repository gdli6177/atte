name: Desktop installers

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-installers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # This GitHub-hosted image is Apple Silicon, so node-pty matches the DMG.
    runs-on: macos-15
    timeout-minutes: 30
    env:
      # GitHub's artifact endpoint intermittently returns 502/504 to hosted
      # runners. The mirror hosts the same Electron archives and checksums.
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - name: Build and sign desktop installers
        run: pnpm desktop:dist
        env:
          # Avoid the shared, unauthenticated GitHub API quota on hosted runners.
          GITHUB_TOKEN: ${{ github.token }}
      - run: pnpm test:desktop
      - run: pnpm test:methods
      - run: pnpm test:task-pool
      - run: pnpm test:installers
      - run: pnpm test:terminal
        env:
          ATTE_KEEP_TEST_ARTIFACTS: '1'
      - name: Upload terminal diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: terminal-smoke-diagnostics
          path: /tmp/cv-terminal-*/
          if-no-files-found: ignore
      - name: Run packaged-app onboarding with authenticated Herdr download
        run: pnpm test:onboarding
        env:
          # The packaged app performs the same official release discovery a
          # user sees. Authenticate it so hosted-runner IP quotas cannot turn a
          # product regression test into a GitHub 403.
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: atte-macOS-arm64
          path: apps/desktop/release/installers/*
          if-no-files-found: error

  release-draft:
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: atte-macOS-arm64
          path: installers
      - name: Attach verified installers to a release draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          Atte 0.13.0 · macOS Apple Silicon

          ## 本版更新

          - 界面换到 Vercel 式极简基线：深色墨底、暖白文字、琥珀作为唯一强调色；去掉装饰性阴影与渐变。
          - 品牌色落地为设计 token（墨 #14181B / 暖白 #F3F1EA / 琥珀 #F5A524；浅色主题琥珀用 #B4761A 保证对比度），仍按 primitive / semantic / component 三层组织。
          - 按钮统一为胶囊形：深色主题主按钮暖白底墨字、浅色主题墨底暖白字；次按钮改为 1px 描边透明底。
          - 卡片改为 1px 描边、12px 圆角、无阴影；状态颜色只出现在小圆点与左侧竖条上。
          - 留白与字阶调整：主区左右 40px、卡片间距 16px、区块间距 40px；标题行高收紧到 1.05。
          - 键盘焦点环统一为 2px 琥珀外环 + 2px 偏移，并放在样式表末尾，避免被组件级重置覆盖。
          - 正文对比度实测：深色 4.80:1、浅色 4.70:1；66 组颜色配对与 8 档字阶一致性检查通过。

          ## 兼容性

          - 无破坏性变更：工作区、CLI、Hook、Skill 与 0.12.0 兼容，升级后不需要重装 CLI 或 Skill。

          ## 安装

          仅支持 Apple Silicon Mac（arm64）。从 Assets 下载 .dmg，将 Atte.app 拖入 Applications；也可下载 .zip 解压安装。
          SHA256SUMS.txt 可用于校验下载文件。GitHub 自动生成的 Source code 是源码，不是安装包。
          安装或替换应用后，请在设置中重新安装 Atte CLI，并检查“Agent 接入”和“工作方法”。
          从 0.11 及更早版本升级时，请重新安装 Atte CLI 与 Skill，以更新命令、环境变量与协议标识。
          Codex 首次使用受管 Hook 时，请按 Codex 提示在 /hooks 中审核并信任 Atte 条目。
          当前安装包没有 Apple Developer ID 签名与公证，macOS 可能提示无法验证开发者。
          核对发布来源后，可在系统设置 > 隐私与安全性中按提示选择仍要打开。
          使用说明：https://github.com/gdli6177/atte/blob/main/docs/atte.md
          升级与回滚说明：https://github.com/gdli6177/atte/blob/main/docs/upgrade-atte.md
          NOTES
          if gh release view "$RELEASE_TAG" --json isDraft > existing.json; then
            test "$(jq -r .isDraft existing.json)" = true || { echo 'Published release is immutable to this workflow'; exit 1; }
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --draft --prerelease --verify-tag \
              --title "Atte $RELEASE_TAG" --notes-file notes.md
          fi
