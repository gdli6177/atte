id = "dev.atte"
name = "Atte"
version = "0.14.1"
min_herdr_version = "0.9.5"
description = "Bring Atte attention, one-line goal intake, and concierge focus into Herdr."
platforms = ["macos"]

[[actions]]
id = "attention"
title = "打开 Atte 注意力"
contexts = ["workspace"]
command = ["/bin/sh", "open-pane.sh", "attention"]

[[actions]]
id = "new-goal"
title = "给 Atte 新建事项"
contexts = ["workspace"]
command = ["/bin/sh", "open-pane.sh", "new-goal"]

[[actions]]
id = "concierge"
title = "回到 Atte 管家"
contexts = ["workspace"]
command = ["/bin/sh", "focus-concierge.sh"]

[[panes]]
id = "attention"
title = "Atte 注意力"
placement = "overlay"
command = ["/bin/sh", "run-cli.sh", "board"]

[[panes]]
id = "new-goal"
title = "Atte 新事项"
placement = "overlay"
command = ["/bin/sh", "new-goal.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["/bin/sh", "sync-live.sh"]

[[events]]
on = "pane.exited"
command = ["/bin/sh", "sync-live.sh"]

[[events]]
on = "pane.closed"
command = ["/bin/sh", "sync-live.sh"]

[[events]]
on = "pane.moved"
command = ["/bin/sh", "sync-live.sh"]

[[events]]
on = "tab.closed"
command = ["/bin/sh", "sync-live.sh"]

[[events]]
on = "workspace.closed"
command = ["/bin/sh", "sync-live.sh"]
